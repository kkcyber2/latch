[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latch"
version = "1.0.0"
description = 'Prompt-injection firewall for LLM applications, with a reproducible 60-case adversarial benchmark.'
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Konain Sultan Khan (KK)", email = "kkdev9715@gmail.com"}]
keywords = ["latch"]

[project.urls]
Homepage = "https://github.com/kkcyber2/latch"
Repository = "https://github.com/kkcyber2/latch"

[tool.setuptools]
packages = ["latch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
